<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Exclusive Access</title>

    <meta
        name="description"
        content="Private Telegram channels with curated premium content.">

    <meta
        name="theme-color"
        content="#050505">

    <meta
        property="og:title"
        content="Exclusive Access">

    <meta
        property="og:description"
        content="Private Telegram channels with curated premium content.">

    <meta
        property="og:type"
        content="website">

    <meta
        property="og:image"
        content="assets/background.jpg">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="css/style.css">

    <link
        rel="stylesheet"
        href="css/responsive.css">

</head>

<body>

    <!-- Background -->

    <div class="background">

        <div class="overlay"></div>

    </div>

    <!-- Main -->

    <main class="hero">

        <div class="container">

            <header class="hero-content">

                <span class="badge">
                    PRIVATE ACCESS
                </span>

                <h1>
                    Exclusive Access
                </h1>

                <p class="subtitle">
                    Join our private Telegram channels for curated premium content, exclusive updates, and member-only resources.
                </p>

            </header>

            <section
                class="channels"
                aria-label="Telegram Channels">

                <!-- Main -->

                <a
                    href="https://t.me/your_main_channel"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="channel-btn">

                    <div class="channel-text">

                        <span class="channel-title">
                            📢 Main Channel
                        </span>

                        <span class="channel-description">
                            Latest updates & announcements
                        </span>

                    </div>

                    <span class="arrow">
                        →
                    </span>

                </a>

                <!-- VIP -->

                <a
                    href="https://t.me/your_vip_channel"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="channel-btn vip">

                    <div class="channel-text">

                        <span class="channel-title">
                            ⭐ VIP Channel
                        </span>

                        <span class="channel-description">
                            Exclusive premium content
                        </span>

                    </div>

                    <span class="arrow">
                        →
                    </span>

                </a>

            </section>

            <footer>

                <p>
                    Private Members Area
                </p>

                <small>
                    © <span class="year"></span>
                </small>

            </footer>

        </div>

    </main>

    <script src="js/app.js"></script>

</body>

</html>
