<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>XIPOP</title>

    <meta name="description" content="Premium Updates">

    <meta name="theme-color" content="#111111">

    <meta name="color-scheme" content="dark">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Background -->

    <div class="background"></div>

    <div class="background-gradient"></div>

    <div class="background-noise"></div>

    <div class="cursor-glow"></div>

    <!-- Main -->

    <main class="hero">

        <section class="glass-card">

            <!-- Badge -->

            <div class="badge">

                <span class="badge-dot"></span>

                Premium

            </div>

            <!-- Logo -->

            <h1 class="title">

                XIPOP

            </h1>

            <p class="subtitle">

                Premium Updates • Fast • Secure

            </p>

            <div class="divider"></div>

            <!-- Buttons -->

            <nav class="button-group">

                <!-- Button 1 -->

                <a href="#"
                   class="link-card">

                    <div class="icon">

                        <svg viewBox="0 0 24 24" aria-hidden="true">

                            <path d="M21.5 3.5L2.9 10.7c-.8.3-.8 1.4.1 1.7l4.6 1.4 1.8 5.4c.3.9 1.5 1 1.9.2l2.7-4 4.9 3.6c.6.4 1.4.1 1.5-.7l2.2-14c.2-.8-.6-1.4-1.2-1.2z"/>

                        </svg>

                    </div>

                    <div class="content">

                        <h3>

                            Latest Updates

                        </h3>

                        <span>

                            Join Telegram

                        </span>

                    </div>

                    <div class="arrow">

                        →

                    </div>

                </a>

                <!-- Button 2 -->

                <a href="#"
                   class="link-card">

                    <div class="icon">

                        <svg viewBox="0 0 24 24">

                            <path d="M21.5 3.5L2.9 10.7c-.8.3-.8 1.4.1 1.7l4.6 1.4 1.8 5.4c.3.9 1.5 1 1.9.2l2.7-4 4.9 3.6c.6.4 1.4.1 1.5-.7l2.2-14c.2-.8-.6-1.4-1.2-1.2z"/>

                        </svg>

                    </div>

                    <div class="content">

                        <h3>

                            VIP Channel

                        </h3>

                        <span>

                            Exclusive Access

                        </span>

                    </div>

                    <div class="arrow">

                        →

                    </div>

                </a>

                <!-- Button 3 -->

                <a href="#"
                   class="link-card">

                    <div class="icon">

                        <svg viewBox="0 0 24 24">

                            <path d="M21.5 3.5L2.9 10.7c-.8.3-.8 1.4.1 1.7l4.6 1.4 1.8 5.4c.3.9 1.5 1 1.9.2l2.7-4 4.9 3.6c.6.4 1.4.1 1.5-.7l2.2-14c.2-.8-.6-1.4-1.2-1.2z"/>

                        </svg>

                    </div>

                    <div class="content">

                        <h3>

                            Community

                        </h3>

                        <span>

                            Stay Connected

                        </span>

                    </div>

                    <div class="arrow">

                        →

                    </div>

                </a>

            </nav>

            <!-- Footer -->

            <footer class="footer">

                <p>

                    © <span id="year">2026</span> XIPOP

                </p>

            </footer>

        </section>

    </main>

    <!-- JavaScript -->

    <script src="js/script.js"></script>

</body>

</html>
