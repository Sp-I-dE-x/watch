<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exclusive Access</title>

    <meta name="description"
        content="Private Telegram channels with curated premium content.">

    <meta name="theme-color" content="#050505">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <!-- Background -->
    <div class="background">
        <div class="overlay"></div>
    </div>

    <!-- Hero -->
    <main class="hero">

        <div class="container">

            <!-- Logo -->
            <img
                src="assets/logo.png"
                alt="Logo"
                class="logo">

            <!-- Heading -->
            <h1>
                Exclusive Access
            </h1>

            <!-- Subtitle -->
            <p class="subtitle">
                Private Telegram channels with curated premium content.
            </p>

            <!-- Primary Button -->
            <a href="#channels" class="primary-btn">
                Join Now
            </a>

            <!-- Telegram Channels -->
            <section
                id="channels"
                class="channels">

                <a
                    href="https://t.me/your_main_channel"
                    target="_blank"
                    rel="noopener"
                    class="channel-btn">

                    <span>
                        Main Channel
                    </span>

                    <span class="arrow">
                        ↗
                    </span>

                </a>

                <a
                    href="https://t.me/your_vip_channel"
                    target="_blank"
                    rel="noopener"
                    class="channel-btn">

                    <span>
                        VIP Channel
                    </span>

                    <span class="arrow">
                        ↗
                    </span>

                </a>

            </section>

        </div>

    </main>

    <!-- Footer -->
    <footer>

        <p>
            Private Members Area
        </p>

        <small>
            © <span class="year"></span>
        </small>
        
    </footer>

    <script src="js/app.js"></script>

</body>

</html>
