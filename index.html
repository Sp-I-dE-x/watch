<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>XiPop</title>

    <meta name="theme-color" content="#000000">
    <meta name="description" content="Premium Telegram Collection">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <!-- Background -->
    <div class="background"></div>
    <div class="overlay"></div>
    <div class="noise"></div>
    <div class="gold-light"></div>
    <div class="cursor-light"></div>

    <main class="hero">

        <!-- Glass Card -->
        <section class="glass-card">

            <div class="badge">
                Premium Collection
            </div>

            <h1 class="logo">
                XIPOP
            </h1>

            <p class="subtitle">
                Premium Telegram Hub
            </p>

            <div class="divider"></div>

            <div class="links">

                <a href="#" class="telegram-card">

                    <div class="card-icon">
                        <img src="assets/telegram.svg" alt="Telegram">
                    </div>

                    <div class="card-content">
                        <h3>Latest Updates</h3>
                        <p>New posts every day</p>
                    </div>

                    <div class="card-arrow">
                        →
                    </div>

                </a>

                <a href="#" class="telegram-card">

                    <div class="card-icon">
                        <img src="assets/telegram.svg" alt="Telegram">
                    </div>

                    <div class="card-content">
                        <h3>VIP Channel</h3>
                        <p>Exclusive premium content</p>
                    </div>

                    <div class="card-arrow">
                        →
                    </div>

                </a>

                <a href="#" class="telegram-card">

                    <div class="card-icon">
                        <img src="assets/telegram.svg" alt="Telegram">
                    </div>

                    <div class="card-content">
                        <h3>Community</h3>
                        <p>Join thousands of members</p>
                    </div>

                    <div class="card-arrow">
                        →
                    </div>

                </a>

            </div>

            <footer>
                © <span id="year"></span> XiPop
            </footer>

        </section>

    </main>

    <script src="js/app.js"></script>
    <script src="js/cursor.js"></script>
    <script src="js/particles.js"></script>

</body>

</html>
