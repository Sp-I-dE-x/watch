<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

    <meta
        http-equiv="X-UA-Compatible"
        content="IE=edge">

    <title>Exclusive Access</title>

    <meta
        name="description"
        content="Join our Telegram channels to watch 18+ premium content, exclusive videos, and member-only resources for free.">

    <meta
        name="theme-color"
        content="#050505">

    <meta
        name="color-scheme"
        content="dark">

    <meta
        property="og:type"
        content="website">

    <meta
        property="og:title"
        content="Exclusive Access">

    <meta
        property="og:description"
        content="Join our Telegram channels to watch premium content.">

    <meta
        property="og:image"
        content="assets/background.jpg">

    <link
        rel="preload"
        as="image"
        href="assets/background.jpg">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="css/style.css">
</head>

<body>

<div class="page">

    <!-- Animated Background -->
    <div class="background">

        <div class="background-overlay"></div>

        <div class="background-gradient"></div>

        <div class="background-noise"></div>

        <div class="background-blur"></div>

    </div>

    <main
        class="hero"
        role="main">

        <div class="container">

            <section class="glass-card">

                <header class="hero-header">

                    <span class="badge">

                        PRIVATE ACCESS

                    </span>

                    <h1 class="hero-title">

                        Exclusive Access

                    </h1>

                    <p class="subtitle">

                        Join our Telegram channels to watch 18+ premium content,
                        exclusive videos, and member-only resources for free.

                    </p>

                </header>

                <section
                    class="channels"
                    aria-label="Telegram Channels">
                                        <a
                        href="https://t.me/XiPopkornBot"
                        class="channel-btn"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Adult Bot (18+ only)">

                        <div class="channel-card">

                            <div class="channel-details">

                                <span class="channel-title">

                                    Adult Bot (18+ only)

                                </span>

                                <span class="channel-description">

                                    Premium & Direct Files

                                </span>

                            </div>

                            <div class="channel-action">

                                <svg
                                    class="arrow-icon"
                                    width="22"
                                    height="22"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    xmlns="http://www.w3.org/2000/svg">

                                    <path
                                        d="M7 17L17 7M17 7H8M17 7V16"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                        stroke-linejoin="round" />

                                </svg>

                            </div>

                        </div>

                    </a>

                    <a
                        href="http://t.me/addlist/3hu3GMYX8y02Mzcx"
                        class="channel-btn vip"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="VIP Channels">

                        <div class="channel-card">

                            <div class="channel-details">

                                <span class="channel-title">

                                    VIP Channels

                                </span>

                                <span class="channel-description">

                                    Exclusive premium content

                                </span>

                            </div>

                            <div class="channel-action">

                                <svg
                                    class="arrow-icon"
                                    width="22"
                                    height="22"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    xmlns="http://www.w3.org/2000/svg">

                                    <path
                                        d="M7 17L17 7M17 7H8M17 7V16"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                        stroke-linejoin="round" />

                                </svg>

                            </div>

                        </div>

                    </a>

                </section>

                <footer class="footer">

                    <p>

                        18+ Members Area

                    </p>

                </footer>

            </section>

        </div>

    </main>
        </div>

    <script src="js/app.js"></script>

</body>

</html>
